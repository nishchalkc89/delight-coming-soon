<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Delight Shopping Mart | Coming Soon</title>
<meta name="description" content="Delight Shopping Mart, Tulsipur's one-stop shopping mart, is coming soon online.">
<meta name="theme-color" content="#0b5d3b">
<link rel="icon" href="logo.png">
<meta property="og:title" content="Delight Shopping Mart | Coming Soon">
<meta property="og:description" content="Everything you need under one roof. Our online store is coming soon.">
<meta property="og:image" content="homepage.webp">
<meta property="og:type" content="website">
<style>
  :root { --green: #0b5d3b; --red: #e11d2a; --ink: #14241c; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;
    color: var(--ink);
    background: #eef5f1;
    overflow: hidden;
  }
  /* your homepage design, slightly blurred */
  .bg {
    position: fixed;
    inset: 0;
    background: url("homepage.webp") center bottom / cover no-repeat;
    filter: blur(2px);
    transform: scale(1.06);          /* hides blur edges and the browser bar in the screenshot */
    transform-origin: center bottom;
    z-index: 0;
  }
  .veil {
    position: fixed;
    inset: 0;
    background: linear-gradient(180deg, rgba(255,255,255,.12), rgba(255,255,255,.22));
    z-index: 1;
  }
  main {
    position: relative;
    z-index: 2;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 1.5rem 1rem;
    text-align: center;
  }
  .box {
    background: rgba(255,255,255,.8);
    -webkit-backdrop-filter: blur(3px);
    backdrop-filter: blur(3px);
    border-radius: 24px;
    padding: 2rem 1.75rem 1.75rem;
    max-width: 640px;
    width: 100%;
    box-shadow: 0 20px 60px rgba(7,65,42,.2);
  }
  .logo { width: min(300px, 80%); height: auto; display: block; margin: 0 auto .5rem; }
  .eyebrow {
    font-size: .78rem;
    letter-spacing: .28em;
    text-transform: uppercase;
    color: #3d5247;
    display: inline-flex;
    align-items: center;
    gap: .7rem;
  }
  .eyebrow::after { content: ""; width: 38px; height: 2px; background: var(--red); }
  h1 {
    font-size: clamp(2.8rem, 10vw, 5rem);
    line-height: 1;
    font-weight: 800;
    letter-spacing: -.02em;
    color: var(--green);
    margin: .8rem 0 .6rem;
  }
  h1 span { color: var(--red); }
  .tagline {
    font-size: clamp(1rem, 3vw, 1.2rem);
    color: #3d5247;
    line-height: 1.5;
    margin-bottom: 1.4rem;
  }
  .status {
    display: inline-flex;
    align-items: center;
    gap: .6rem;
    background: var(--red);
    color: #fff;
    font-weight: 700;
    padding: .8rem 1.5rem;
    border-radius: 10px;
    box-shadow: 0 6px 16px rgba(225,29,42,.3);
  }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: #fff; animation: pulse 1.6s infinite; }
  @keyframes pulse {
    0%   { box-shadow: 0 0 0 0 rgba(255,255,255,.7); }
    70%  { box-shadow: 0 0 0 10px rgba(255,255,255,0); }
    100% { box-shadow: 0 0 0 0 rgba(255,255,255,0); }
  }
  .info { margin-top: 1.3rem; font-size: .9rem; color: #3d5247; line-height: 1.6; }
  .info strong { color: var(--ink); }
  @media (prefers-reduced-motion: reduce) { .dot { animation: none; } }
</style>
</head>
<body>
  <div class="bg" role="presentation"></div>
  <div class="veil"></div>

  <main>
    <section class="box">
      <img class="logo" src="logo.png" alt="Delight Shopping Mart Pvt. Ltd.">
      <p class="eyebrow">Your Local Shopping Mart</p>
      <h1>Coming <span>Soon</span></h1>
      <p class="tagline">Everything you need under one roof. Shop local, live better.</p>
      <div class="status"><span class="dot"></span> Our online store is launching soon</div>
      <p class="info">Tulsipur &bull; Open daily <strong>7:00 AM &ndash; 9:00 PM</strong></p>
    </section>
  </main>
</body>
</html>
